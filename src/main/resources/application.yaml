spring:
  application:
    name: mem-kek

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE-SERVER:jdbc:postgresql://localhost:5432/mem_kek_db}
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

