spring:
  application:
    name: mem-kek

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE-SERVER:jdbc:postgresql://localhost:5432/mem_kek_db}
    username: postgres
    password: postgres

  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/mem_kek_db}
    username: ${R2DBC_USERNAME:postgres}
    password: ${R2DBC_PASSWORD:postgres}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    url: ${DATASOURCE-SERVER:jdbc:postgresql://localhost:5432/mem_kek_db}
    user: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

logging:
  level:
    org.springframework.r2dbc.core: DEBUG
    liquibase: INFO

